title: Pi Node Telegram Controller PRO
description: Monitor Pi Node via Horizon + Core + ports. Icon reports. Optional Gemini AI.
output_file: .env

fixed_values:
  - name: UID
    detect: uid

fields:
  - name: BOT_TOKEN
    label: Telegram Bot Token
    type: password
    required: true
    help: Create bot with BotFather and paste token.

  - name: CHAT_ID
    label: Telegram Chat ID
    type: text
    required: true
    help: Your chat ID (userinfobot).

  - name: GEMINI_API_KEY
    label: Gemini API Key (AI)
    type: password
    required: false
    help: Optional. Leave empty for rules-only assistant.
