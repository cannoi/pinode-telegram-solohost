title: Pi Node Telegram Controller PRO
description: Giam sat Pi Node 24/7. Data Live + Horizon + AI. Dan Bot Token, Chat ID, Gemini (tuy chon).
output_file: .env

fixed_values:
  - name: UID
    detect: uid

fields:
  - name: BOT_TOKEN
    label: Telegram Bot Token
    type: password
    required: true
    help: Tao bot tai BotFather roi sao chep token.

  - name: CHAT_ID
    label: Telegram Chat ID
    type: text
    required: true
    help: ID chat. Dung userinfobot.

  - name: GEMINI_API_KEY
    label: Gemini API Key (AI)
    type: password
    required: false
    help: Tuy chon. De trong neu chi dung Rules. Lay key tai Google AI Studio.
