# config_options.yml — form cài đặt Pi Desktop hiển thị.
title: Pi Node Telegram Controller PRO
description: Giám sát Pi Node 24/7 qua Telegram trên SoloHost. Cảnh báo tự động, lệnh tiếng Việt, nút tải Windows PRO. Dán Bot Token và Chat ID là xong.
output_file: .env

fixed_values:
  - name: UID
    detect: uid

fields:
  - name: BOT_TOKEN
    label: Telegram Bot Token
    type: password
    required: true
    help: Tạo bot tại @BotFather rồi sao chép token dán vào đây.

  - name: CHAT_ID
    label: Telegram Chat ID
    type: text
    required: true
    help: ID chat hoặc nhóm nhận cảnh báo. Dùng @userinfobot để lấy ID.

  - name: ALERT_ON_START
    label: Bao khi app khoi dong (true/false)
    type: text
    required: false
    help: true = gui tin Controller online khi start. Mac dinh true.

  - name: REPORT_HOURS
    label: Gio bao cao dinh ky
    type: text
    required: false
    help: Cac gio 0-23 theo gio Viet Nam, cach nhau dau phay. Vi du 7,19.

  - name: ALERT_COOLDOWN_SEC
    label: Chong spam canh bao (giay)
    type: text
    required: false
    help: Khoang cach toi thieu giua hai lan alert. Vi du 60.
