title: Pi Node Telegram Controller PRO
description: Giam sat Pi Node 24/7. Horizon+Core, bao cao icon, canh bao thong minh. Dan Bot Token va Chat ID.
output_file: .env
fixed_values:
  - name: UID
    detect: uid
fields:
  - name: BOT_TOKEN
    label: Telegram Bot Token
    type: password
    required: true
    help: @BotFather
  - name: CHAT_ID
    label: Telegram Chat ID
    type: text
    required: true
    help: @userinfobot
  - name: ALERT_ON_START
    label: Bao khi khoi dong (true/false)
    type: text
    required: false
    help: Mac dinh true
  - name: REPORT_HOURS
    label: Gio bao cao (VD 7,19)
    type: text
    required: false
    help: Gio VN, de trong = 7,19
  - name: ALERT_COOLDOWN_SEC
    label: Chong spam alert (giay)
    type: text
    required: false
    help: VD 180
  - name: HORIZON_PORT
    label: Cong Horizon (host)
    type: text
    required: false
    help: Mac dinh 31401 (map 8000 trong Pi Node)
  - name: STELLAR_CORE_PORT
    label: Cong Core HTTP (neu co)
    type: text
    required: false
    help: Thuong 11626 — chi dung neu da publish
  - name: PI_CONTAINER
    label: Ten container (hien thi)
    type: text
    required: false
    help: VD testnet2
  - name: GEMINI_API_KEY
    label: Gemini API Key (AI)
    type: password
    required: false
    help: Tuy chon
