title: Pi Node Telegram Controller PRO
eyebrow: SoloHost Monitor
description: >-
  Giám sát & điều khiển Pi Node 24/7 qua Telegram ngay trên SoloHost.
  Cảnh báo Soft/Warning/Critical, báo cáo định kỳ, reset node (khi bật Docker),
  lệnh tiếng Việt. Bản Windows đầy đủ xem trên GitHub.
output_file: .env

fixed_values:
  - name: UID
    detect: uid

fields:
  - name: BOT_TOKEN
    label: Telegram Bot Token
    type: password
    required: true
    help: Tạo bot tại @BotFather → copy token (dạng 123456:ABC-DEF...).

  - name: CHAT_ID
    label: Telegram Chat ID
    type: text
    required: true
    help: ID chat/nhóm nhận cảnh báo. Dùng @userinfobot hoặc gửi tin cho bot.

  - name: ALERT_ON_START
    label: Báo khi app khởi động
    type: checkbox
    required: false
    default: true
    help: Gửi tin "Controller online" mỗi lần container start.

  - name: REPORT_HOURS
    label: Giờ gửi báo cáo định kỳ (0-23, cách nhau dấu phẩy)
    type: text
    required: false
    default: "7,19"
    help: Ví dụ 7,19 = báo cáo lúc 7h và 19h (giờ máy host/container).

  - name: ALERT_COOLDOWN_SEC
    label: Chống spam cảnh báo (giây)
    type: text
    required: false
    default: "60"
    help: Khoảng cách tối thiểu giữa hai lần gửi alert cùng loại.
