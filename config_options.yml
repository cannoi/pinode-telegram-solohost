title: Pi Node Telegram Controller PRO
description: Monitor Pi Node via Horizon + Core + ports. AI technician analysis needs Gemini API Key.
output_file: .env

fixed_values:
  - name: UID
    detect: uid

fields:
  - name: BOT_TOKEN
    label: Telegram Bot Token
    type: password
    required: true
    help: Create bot with BotFather and paste token.

  - name: CHAT_ID
    label: Telegram Chat ID
    type: text
    required: true
    help: Your chat ID (userinfobot).

  - name: GEMINI_API_KEY
    label: Gemini API Key (strongly recommended for AI chat)
    type: password
    required: false
    help: Free key at Google AI Studio. Without it, chat uses local technician summary only.

  - name: PI_BROWSER_BACKEND
    label: Pi Browser app origin (optional)
    type: text
    required: false
    help: HTTPS origin of the logged-in Pi app. No trailing slash. Example https://your-app.example.com

  - name: PI_BROWSER_LABEL
    label: This PC label
    type: text
    required: false
    default: Home SoloHost
    help: Name shown on Pi Browser My Nodes after pairing.
