# docker-compose.yml — bản tối giản nếu SoloHost từ chối extra_hosts
services:
  agent:
    image: ghcr.io/cannoi/pinode-telegram-solohost:v2.2.0
    container_name: PiNode-Telegram-Controller
    labels:
      pi.ui.primary: "true"
    ports:
      - '127.0.0.1:18780:8080'
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - CHAT_ID=${CHAT_ID}
      - ALERT_ON_START=${ALERT_ON_START}
      - REPORT_HOURS=${REPORT_HOURS}
      - ALERT_COOLDOWN_SEC=${ALERT_COOLDOWN_SEC}
      - NODE_HOST=host.docker.internal
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./data:/data
    restart: unless-stopped
