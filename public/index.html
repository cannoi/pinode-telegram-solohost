<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pi Node SoloHost</title>
<style>
body{font-family:system-ui,sans-serif;background:#0a0e17;color:#f0f4fc;padding:20px;max-width:480px;margin:0 auto}
.card{background:#121a2b;border:1px solid #2a3a55;border-radius:12px;padding:14px;margin:10px 0}
h1{font-size:1.2rem}.m{color:#9aabd0;font-size:.85rem}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #1e2a3d}
.btn{display:inline-block;margin:4px;padding:8px 12px;background:#1a2740;color:#4da3ff;border-radius:8px;text-decoration:none;font-size:.8rem}
</style></head>
<body>
<h1>Pi Node Controller SoloHost</h1>
<p class="m">v2.5 · Data Live → Horizon → Ports</p>
<div class="card" id="s">Loading…</div>
<div class="card">
  <b>Scripts (Windows)</b><br>
  <a class="btn" href="/scripts/CleanRAM_PiNode.ps1">CleanRAM</a>
  <a class="btn" href="/scripts/Weekly_Maintenance.ps1">Maintenance</a>
  <a class="btn" href="/scripts/Reset_Node_Network.ps1">Reset Network</a>
  <a class="btn" href="/scripts/Pi_Node_Diagnostic_PRO.ps1">Diagnostic</a>
</div>
<script>
async function load(){
  try{
    const t=await fetch('/api/status').then(r=>r.json());
    const rows=[];
    const add=(k,v)=>{if(v!=null&&v!=='')rows.push('<div class="row"><span>'+k+'</span><b>'+v+'</b></div>');};
    add('Source',t.source);add('Sync',t.sync);add('Ledger',t.ledger);
    add('Peers',(t.peer_in!=null||t.peer_out!=null)?('IN '+(t.peer_in??'?')+' / OUT '+(t.peer_out??'?')):null);
    add('Docker',t.docker);add('Container',t.container);
    add('RAM',t.ram!=null?t.ram+'%':null);add('CPU',t.cpu!=null?t.cpu+'%':null);add('Temp',t.temp!=null?t.temp+'°C':null);
    document.getElementById('s').innerHTML=rows.join('')||'No data yet — start Data Live on Windows';
  }catch(e){document.getElementById('s').textContent='Error loading status';}
}
load();setInterval(load,15000);
</script>
</body></html>
