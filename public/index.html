<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pi Node Controller PRO</title>
<style>
:root{--p:rgba(255,255,255,.16);--bd:rgba(255,255,255,.42);--t:#f3f6fb;--m:#d7deea;--gold:#4cc2ff;--ok:#16c60c;--win:#0078d7}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,sans-serif;color:var(--t);min-height:100vh;
background-color:#1b140c;
background-image:linear-gradient(180deg,rgba(10,18,30,.32),rgba(8,12,18,.46)),var(--bg-image,url("/bg-cave.jpg"));
background-position:center top;background-size:cover;background-repeat:no-repeat;background-attachment:fixed;
padding:14px;display:flex;justify-content:center;
transition:padding-top .25s ease}
body.has-sysres{padding-top:64px}
.sysres-bar{
  position:fixed;top:8px;left:50%;transform:translateX(-50%);
  z-index:60;width:calc(100% - 28px);max-width:480px;
  display:flex;align-items:center;justify-content:center;gap:5px;
  padding:5px 8px;border-radius:12px;background:rgba(255,255,255,.14);
  -webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);
  border:1px solid rgba(255,255,255,.42);
  box-shadow:0 8px 28px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.22);
  color:#fff;font-size:.7rem;font-weight:600;
}
.sysres-bar[hidden]{display:none!important}
.sysres-item{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:4px;padding:3px 6px;border-radius:6px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);white-space:nowrap;overflow:hidden}
.sysres-value{font-weight:700;font-size:.66rem;overflow:hidden;text-overflow:ellipsis}
.w{width:100%;max-width:480px}
.hero{text-align:center;margin-bottom:10px;position:relative}
.settings-btn{position:absolute;top:0;right:0;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);
color:#fff;border-radius:50%;width:32px;height:32px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.settings-btn:hover{background:rgba(255,255,255,.35)}
.ring{width:72px;height:72px;margin:0 auto 8px;border-radius:50%;padding:2px;background:linear-gradient(135deg,#4cc2ff,#0078d7)}
.ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
h1{font-size:1.12rem;font-weight:700;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.45)}
.sub{font-size:.75rem;color:var(--m)}
.card{background:var(--p);border:1px solid var(--bd);border-radius:6px;padding:12px;margin-bottom:10px;
backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
box-shadow:0 8px 28px rgba(0,0,0,.18)}
.card h2{font-size:.65rem;color:var(--m);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed rgba(255,255,255,.16);font-size:.85rem}
.k{color:var(--m)}.val{font-weight:700}
/* Modal styles */
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none!important}
.modal-content{background:#222a38;border:1px solid rgba(255,255,255,.3);border-radius:12px;padding:20px;width:100%;max-width:420px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.modal-content h3{margin-bottom:14px;font-size:1rem;color:#fff}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:.75rem;color:var(--m);margin-bottom:4px}
.form-group input{width:100%;padding:8px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.3);color:#fff;font-size:.85rem}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.btn{padding:6px 14px;border-radius:6px;border:none;font-weight:600;cursor:pointer}
.btn-primary{background:#0078d7;color:#fff}
.btn-secondary{background:rgba(255,255,255,.2);color:#fff}
.paf-made-by{text-align:center;font-size:0.7rem;color:rgba(255,255,255,0.5);margin:16px 0 8px}
</style>
<style>.paf-made-by{position:fixed;right:8px;bottom:8px;width:min(72px,12vw);max-width:12vw;height:auto;object-fit:contain;opacity:.5;background:transparent;padding:0;border:0;box-shadow:none;filter:none;pointer-events:none;z-index:30}</style></head>
<body>
<div class="sysres-bar" id="sysresBar" hidden>
  <span class="sysres-title">Host</span>
  <div class="sysres-item"><span class="sysres-label">CPU</span><span class="sysres-value" id="sysresCpu">--%</span></div>
  <div class="sysres-item"><span class="sysres-label">RAM</span><span class="sysres-value" id="sysresRam">--%</span></div>
  <div class="sysres-item"><span class="sysres-label">Disk</span><span class="sysres-value" id="sysresDisk">--%</span></div>
</div>

<div class="w">
  <div class="hero">
    <button class="settings-btn" id="openSettingsBtn" title="Settings">⚙</button>
    <div class="ring"><img src="/avatar.jpg" alt="Logo" id="appLogo"></div>
    <h1 id="appTitle">Pi Node Controller PRO</h1>
    <p class="sub" id="appSub">SoloHost Edition</p>
  </div>

  <div class="card">
    <h2>Node Status</h2>
    <div class="row"><span class="k">Sync State</span><span class="val" id="syncState">Loading...</span></div>
    <div class="row"><span class="k">Ledger</span><span class="val" id="ledgerVal">--</span></div>
    <div class="row"><span class="k">Peers</span><span class="val" id="peersVal">--</span></div>
  </div>

  <div class="card">
    <h2>Quick Chat & Logs</h2>
    <div id="chatBox" style="max-height:160px;overflow-y:auto;font-size:.8rem;margin-bottom:8px;padding:4px"></div>
    <div style="display:flex;gap:6px">
      <input type="text" id="chatInput" placeholder="Ask or type command..." style="flex:1;padding:6px;border-radius:4px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.2);color:#fff">
      <button id="sendBtn" class="btn btn-primary">Send</button>
    </div>
  </div>

  
</div>

<!-- Settings Modal -->
<div class="modal" id="settingsModal" hidden>
  <div class="modal-content">
    <h3>Node & AI Settings</h3>
    <div class="form-group">
      <label>AI Token / Key (Gemini/OpenAI)</label>
      <input type="password" id="aiTokenInput" placeholder="Enter AI API Key...">
    </div>
    <div class="form-group">
      <label>Telegram Bot Token</label>
      <input type="password" id="tgTokenInput" placeholder="123456789:ABCdef...">
    </div>
    <div class="form-group">
      <label>Telegram Chat ID</label>
      <input type="text" id="tgChatIdInput" placeholder="e.g. 12345678">
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="closeSettingsBtn">Cancel</button>
      <button class="btn btn-primary" id="saveSettingsBtn">Save Settings</button>
    </div>
  </div>
</div>

<script>
async function loadStatus() {
  try {
    const res = await fetch('/api/status');
    const data = await res.json();
    document.getElementById('syncState').innerText = data.sync || 'Online';
    document.getElementById('ledgerVal').innerText = data.ledger || '--';
    document.getElementById('peersVal').innerText = data.peers || '--';
  } catch(e) {}
}

async function loadSettings() {
  try {
    const res = await fetch('/api/settings');
    const data = await res.json();
    if(data) {
      document.getElementById('aiTokenInput').value = data.aiToken || '';
      document.getElementById('tgTokenInput').value = data.tgToken || '';
      document.getElementById('tgChatIdInput').value = data.tgChatId || '';
    }
  } catch(e){}
}

document.getElementById('openSettingsBtn').onclick = () => {
  loadSettings();
  document.getElementById('settingsModal').hidden = false;
};
document.getElementById('closeSettingsBtn').onclick = () => {
  document.getElementById('settingsModal').hidden = true;
};
document.getElementById('saveSettingsBtn').onclick = async () => {
  const aiToken = document.getElementById('aiTokenInput').value;
  const tgToken = document.getElementById('tgTokenInput').value;
  const tgChatId = document.getElementById('tgChatIdInput').value;
  try {
    await fetch('/api/settings', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ aiToken, tgToken, tgChatId })
    });
    alert('Settings saved successfully!');
    document.getElementById('settingsModal').hidden = true;
  } catch(e) {
    alert('Failed to save settings.');
  }
};

setInterval(loadStatus, 5000);
loadStatus();
</script>
<img class="paf-made-by" src="/made-by.png" alt="Made with App Builder — Pi SoloHost"></body>
</html>
