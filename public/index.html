<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pi Node Controller PRO</title>
<style>
:root{--p:rgba(255,255,255,.16);--bd:rgba(255,255,255,.42);--t:#f3f6fb;--m:#d7deea;--gold:#4cc2ff;--ok:#16c60c;--win:#0078d7}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,sans-serif;color:var(--t);min-height:100vh;
background-color:#1b140c;
background-image:linear-gradient(180deg,rgba(10,18,30,.32),rgba(8,12,18,.46)),var(--bg-image,url("/bg-cave.jpg"));
background-position:center top;background-size:cover;background-repeat:no-repeat;background-attachment:fixed;
padding:14px;display:flex;justify-content:center;
transition:padding-top .22s ease}
/* Reserve space when SYSTEM RESOURCES bar is visible */
body.has-sysres{padding-top:74px}

/* ============================================================
 * SYSTEM RESOURCES bar — Windows 10 Aero / glassmorphism
 * Fixed at top of viewport. Auto-hides when host metrics off.
 * ============================================================ */
.sysres-bar{
  position:fixed;top:0;left:0;right:0;z-index:60;
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;
  gap:14px;
  padding:12px 18px;
  background:linear-gradient(180deg,rgba(22,30,44,.72),rgba(18,24,36,.56));
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  backdrop-filter:blur(30px) saturate(180%);
  border-bottom:1px solid rgba(255,255,255,.28);
  box-shadow:0 8px 24px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.12);
  color:#fff;font-size:.8rem;font-weight:600;letter-spacing:.2px;
  animation:sysresIn .28s ease;
}
.sysres-bar[hidden]{display:none!important}
@keyframes sysresIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.sysres-title{
  color:var(--m);font-weight:700;text-transform:uppercase;
  font-size:.66rem;letter-spacing:.7px;margin-right:4px
}
.sysres-item{
  display:flex;align-items:center;gap:6px;
  padding:3px 10px;border-radius:5px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.10);
  transition:background .2s,border-color .2s;
  white-space:nowrap;
}
.sysres-item:hover{background:rgba(255,255,255,.11)}
.sysres-icon{font-size:.98rem;line-height:1;opacity:.96}
.sysres-label{color:var(--m);font-weight:600;font-size:.74rem}
.sysres-value{font-weight:700;color:#fff;font-size:.79rem}
.sysres-item.warn{border-color:rgba(255,193,7,.55);background:rgba(255,193,7,.10)}
.sysres-item.warn .sysres-value{color:#ffc107}
.sysres-item.crit{border-color:rgba(232,17,35,.65);background:rgba(232,17,35,.14)}
.sysres-item.crit .sysres-value{color:#ff5a5a}

.w{width:100%;max-width:480px}
.hero{text-align:center;margin-bottom:10px}
.ring{width:72px;height:72px;margin:0 auto 8px;border-radius:50%;padding:2px;background:linear-gradient(135deg,#4cc2ff,#0078d7)}
.ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
h1{font-size:1.12rem;font-weight:700;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.45)}
.sub{font-size:.75rem;color:var(--m)}
.card{background:var(--p);border:1px solid var(--bd);border-radius:6px;padding:12px;margin-bottom:10px;
backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
box-shadow:0 8px 28px rgba(0,0,0,.18)}
.card h2{font-size:.65rem;color:var(--m);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed rgba(255,255,255,.16);font-size:.85rem}
.k{color:var(--m)}.val{font-weight:700}

.status-layout{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
.status-col{display:flex;flex-direction:column;gap:10px;font-size:.85rem;min-width:70px}
.status-col.left{text-align:left}
.status-col.right{text-align:right}
.gauge-wrap{position:relative;width:210px;height:120px;display:flex;flex-direction:column;align-items:center;margin:0 auto}
.gauge-svg{width:100%;height:100%;overflow:visible}
.gauge-center{position:absolute;top:42px;left:0;right:0;text-align:center;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.gauge-score{font-size:1.4rem;font-weight:800;letter-spacing:.5px}
.gauge-label{font-size:.75rem;font-weight:700;color:#fff;margin-top:2px}
.gauge-status{font-size:.72rem;color:#fff;margin-top:1px}
.gauge-status span{font-weight:700}

#chatbox{height:200px;overflow-y:auto;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.28);border-radius:4px;padding:8px;margin-bottom:8px;font-size:.8rem}
.msg{margin:6px 0;padding:7px 9px;border-radius:4px;max-width:96%;white-space:pre-wrap}
.msg.user{background:rgba(0,120,215,.28);margin-left:auto;text-align:right}
.msg.bot{background:rgba(255,255,255,.14)}
.hint{font-size:.72rem;color:var(--m);margin-top:4px}
.hz-note{font-size:.68rem;color:var(--m);margin-top:8px;line-height:1.4;text-align:left}
.hz-note[hidden]{display:none}
.bar{display:flex;gap:6px}
.bar input{flex:1;padding:10px;border-radius:4px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:var(--t);outline:none}
.bar input:focus{border-color:#4cc2ff;box-shadow:0 0 0 2px rgba(76,194,255,.25)}
.bar button{padding:10px 14px;border-radius:4px;border:0;background:linear-gradient(180deg,#4cc2ff,#0078d7);color:#fff;font-weight:700;cursor:pointer}
.qbar{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 8px}
.qbar button{padding:6px 8px;border-radius:4px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:var(--t);font-size:.68rem;font-weight:650;cursor:pointer;backdrop-filter:blur(12px)}
.qbar button:hover{background:rgba(76,194,255,.28);border-color:#4cc2ff}
.bgbar{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:8px 0 2px}
.bgbar button,.bgbar label{padding:5px 8px;border-radius:4px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;font-size:.64rem;font-weight:650;cursor:pointer}
.bgbar button.on{background:rgba(0,120,215,.45);border-color:#4cc2ff}
.bellwrap{position:relative;display:inline-block;margin-left:8px;vertical-align:middle}
.bell{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:4px;padding:4px 8px;cursor:pointer;font-size:.85rem}
.badge{position:absolute;top:-6px;right:-6px;background:#e81123;color:#fff;border-radius:8px;font-size:.6rem;min-width:16px;text-align:center;padding:1px 4px;display:none}
.panel{display:none;text-align:left;background:rgba(20,28,40,.72);border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:8px;margin:8px auto 0;max-width:480px;max-height:220px;overflow:auto;font-size:.75rem;backdrop-filter:blur(18px)}
.panel.on{display:block}
.panel .item{border-bottom:1px dashed rgba(255,255,255,.2);padding:6px 0;white-space:pre-wrap}
.foot{text-align:center;font-size:.62rem;color:#c9d3e0;margin-top:6px;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.link{color:#9ad8ff;cursor:pointer;text-decoration:underline;background:none;border:0;font:inherit;padding:0}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(8px)}
.modal.on{display:flex}
.modal .box{background:rgba(20,28,40,.55);border:1px solid rgba(255,255,255,.35);border-radius:6px;max-width:440px;width:100%;max-height:90vh;display:flex;flex-direction:column;backdrop-filter:blur(24px)}
.modal h3{padding:12px 14px;font-size:.95rem;border-bottom:1px solid rgba(255,255,255,.2)}
.terms{padding:12px 14px;overflow-y:auto;flex:1;font-size:.78rem;line-height:1.45;white-space:pre-wrap;color:#eef3f8}
.modal .footbar{padding:10px 14px;border-top:1px solid rgba(255,255,255,.2);display:flex;flex-direction:column;gap:8px}
.modal label{font-size:.75rem;color:var(--m);display:flex;gap:8px;align-items:flex-start}
.btn{padding:10px;border-radius:4px;border:0;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-ok{background:var(--win);color:#fff}
.btn-no{background:rgba(255,255,255,.18);color:#fff}
</style>
</head>
<body>

<!-- ============================================================
     SYSTEM RESOURCES — fixed at top, Windows 10 Aero
     Auto-hides when host metrics unavailable.
     ============================================================ -->
<div id="sysresBar" class="sysres-bar" hidden aria-label="System Resources">
  <span class="sysres-title">System Resources:</span>
  <div class="sysres-item" id="sysresRamRow">
    <span class="sysres-icon">💾</span>
    <span class="sysres-label">RAM:</span>
    <span class="sysres-value" id="sysresRam">—</span>
  </div>
  <div class="sysres-item" id="sysresCpuRow">
    <span class="sysres-icon">📊</span>
    <span class="sysres-label">CPU:</span>
    <span class="sysres-value" id="sysresCpu">—</span>
  </div>
  <div class="sysres-item" id="sysresDiskRow">
    <span class="sysres-icon">💿</span>
    <span class="sysres-label">Disk:</span>
    <span class="sysres-value" id="sysresDisk">—</span>
  </div>
</div>

<div class="w">
  <div class="hero">
    <div class="ring"><img src="/avatar.jpg" alt=""></div>
    <h1>Pi Node Controller PRO <span class="bellwrap"><button type="button" class="bell" id="bell">🔔</button><span class="badge" id="badge">0</span></span></h1>
    <p class="sub">SoloHost · v2.6.57</p>
    <div class="bgbar">
      <button type="button" data-bg="cave" id="bgCave">🌄 Cave</button>
      <button type="button" data-bg="classic" id="bgClassic">🖼️ Classic</button>
      <button type="button" data-bg="pi" id="bgPi">🟣 Pi</button>
      <label>📤 Upload<input type="file" id="bgFile" accept="image/*" hidden></label>
    </div>
  </div>
  <div class="panel" id="alertPanel"></div>
  <div class="card"><h2>Live status</h2>
    <div id="s">…</div>
    <p class="hz-note hint" id="pn-horizon-note">ℹ️ Data may lag Pi Desktop. 🔓 <button type="button" class="link" id="dkTip">Optional Docker…</button></p>
  </div>
  <div class="card">
    <h2>Chat</h2>
    <div class="qbar" id="abar">
      <button type="button" data-dl="/actions/CleanRAM.bat">🧹 CleanRAM</button>
      <button type="button" data-dl="/actions/DnsFlush.bat">🌐 DnsFlush</button>
      <button type="button" data-dl="/actions/Firewall.bat">🧱 Firewall</button>
      <button type="button" data-dl="/actions/NetRepair.bat">🔧 NetRepair</button>
      <button type="button" data-dl="/actions/LanSetup.bat">📌 LanSetup</button>
      <button type="button" data-dl="/actions/NodeReset.bat">♻️ NodeReset</button>
      <button type="button" data-dl="/actions/DockerRecover.bat">🐳 Docker</button>
      <button type="button" data-dl="/actions/Maintain.bat">🗓️ Maintain</button>
    </div>
    <div id="chatbox"></div>
    <div class="qbar" id="qbar">
      <button type="button" data-cmd="/help">❓ HELP</button>
      <button type="button" data-cmd="/status">📊 STATUS</button>
      <button type="button" data-cmd="/report">📈 REPORT</button>
      <button type="button" data-cmd="/peers">👥 PEERS</button>
      <button type="button" data-cmd="/diagnostic">🩺 DIAG</button>
      <button type="button" data-cmd="/analyze">💬 ANALYZE</button>
      <button type="button" data-cmd="/logs">📋 LOGS</button>
      <button type="button" data-cmd="/donate">💛 DONATE</button>
    </div>
    <div class="bar">
      <input id="inp" type="text" placeholder="Message…" autocomplete="off" maxlength="2000">
      <button id="send" type="button">Send</button>
    </div>
  </div>
  <p class="foot">Telegram for remote status · Docker only via this SoloHost UI</p>
</div>

<div class="modal" id="dkModal" role="dialog" aria-modal="true">
  <div class="box">
    <h3>Optional Docker Access — Terms</h3>
    <div class="terms" id="termsBox"></div>
    <div class="footbar">
      <label><input type="checkbox" id="dkRead" disabled> I have scrolled to the end and read the full terms</label>
      <label><input type="checkbox" id="dkAgree" disabled> I accept the terms and understand this is my Operator choice on this machine</label>
      <button type="button" class="btn btn-ok" id="dkConfirm" disabled>Confirm — write compose</button>
      <button type="button" class="btn btn-no" id="dkCancel">Cancel</button>
    </div>
  </div>
</div>

<script>
const TERMS = `OPTIONAL DOCKER ACCESS — TERMS

What this is
This SoloHost app can optionally use the Docker engine socket on YOUR computer to read Pi Node container status (for example Core info via docker exec). This is OFF by default.

SoloHost default permissions
Sandbox: CPU and memory, one localhost port, the app data folder, outbound network. docker.sock is NOT a default SoloHost permission and is NOT required for normal monitoring (Horizon, ports, reports, AI chat).

What you grant if you Confirm
• The app may overwrite docker-compose.yml in this app folder to mount /var/run/docker.sock read-only.
• The app may list containers and run limited read/exec commands for node status.
• A higher privilege level than the default sandbox.

What we do not claim
• No access to your Pi wallet or keys.
• No guarantee of host security after you enable elevated access.
• The publisher does not operate your Docker daemon.

Your responsibility (Operator)
Under SoloHost Terms you decide permissions on your machine. By confirming you accept:
1) docker.sock is powerful and may expose Docker on this PC.
2) Risk of optional diagnostics is yours.
3) You can disable later and remove the socket volume, then Stop → Start.
4) Pi Network, SoloHost, and the publisher are not responsible for damage, data loss, or misuse from elevated access you enable.

Purpose of the app
Provide the best monitoring help within clear limits. Docker access is optional, user-controlled, and never required for core features.

After Confirm
SoloHost UI: press Stop, then Start the app again so the new compose applies.

Confirm only if you accept these terms in full.`;

function $(id){ return document.getElementById(id); }
function on(el, ev, fn){ if (el) el.addEventListener(ev, fn); }

const box=$('chatbox');
const termsBox=$('termsBox');
if(termsBox) termsBox.textContent=TERMS;

function add(role,text){const d=document.createElement('div');d.className='msg '+role;d.textContent=text;if(box){box.appendChild(d);box.scrollTop=box.scrollHeight;}}

function setupTermsScroll(){
  const read=$('dkRead');
  const agree=$('dkAgree');
  const conf=$('dkConfirm');
  if(!read||!agree||!conf) return;
  function refresh(){conf.disabled=!(read.checked&&agree.checked);}
  read.onchange=refresh;agree.onchange=refresh;
  if(termsBox){
    termsBox.onscroll=function(){
      const el=termsBox;
      if(el.scrollTop+el.clientHeight>=el.scrollHeight-8){
        read.disabled=false;
      }
    };
    setTimeout(function(){
      if(termsBox.scrollHeight<=termsBox.clientHeight+4) read.disabled=false;
    },400);
  }
}

/* ============================================================
 * SYSTEM RESOURCES bar
 * Reads t.system from /api/status. Auto-hides if unavailable.
 * ============================================================ */
function _fmtGB(b){ return b != null && isFinite(Number(b)) ? (Number(b)/1073741824).toFixed(1) : null; }
function _fmtGB0(b){ return b != null && isFinite(Number(b)) ? (Number(b)/1073741824).toFixed(0) : null; }

function _updateSysresRow(rowId, valueId, opts){
  const row = $(rowId); const el = $(valueId);
  if(!row || !el) return;
  if(opts.text == null){ el.textContent = '—'; row.classList.remove('warn','crit'); return; }
  el.textContent = opts.text;
  row.classList.toggle('warn', !!(opts.warn));
  row.classList.toggle('crit', !!(opts.crit));
}

function _applySysres(sys){
  const bar = $('sysresBar');
  if(!bar) return;
  const avail = !!(sys && sys.available);
  bar.hidden = !avail;
  if(document.body) document.body.classList.toggle('has-sysres', avail);
  if(!avail) return;

  // RAM
  let ramText = null, ramWarn = false, ramCrit = false;
  if(sys.memory_percent != null){
    const pct = Number(sys.memory_percent);
    const usedGB = _fmtGB(sys.memory_used_bytes);
    const totGB = _fmtGB(sys.memory_total_bytes);
    ramText = (usedGB != null && totGB != null)
      ? (usedGB + ' GB / ' + totGB + ' GB')
      : (pct + '%');
    ramWarn = pct >= 85 && pct < 92;
    ramCrit = pct >= 92;
  }
  _updateSysresRow('sysresRamRow','sysresRam',{ text: ramText, warn: ramWarn, crit: ramCrit });

  // CPU
  let cpuText = null, cpuWarn = false, cpuCrit = false;
  if(sys.cpu_percent != null){
    const pct = Number(sys.cpu_percent);
    cpuText = pct + '% (Avg)';
    cpuWarn = pct >= 85 && pct < 95;
    cpuCrit = pct >= 95;
  }
  _updateSysresRow('sysresCpuRow','sysresCpu',{ text: cpuText, warn: cpuWarn, crit: cpuCrit });

  // Disk
  let diskText = null, diskWarn = false, diskCrit = false;
  if(sys.disk_percent != null){
    const pct = Number(sys.disk_percent);
    const drv = sys.disk_drive ? (sys.disk_drive + ' ') : '';
    const used = _fmtGB0(sys.disk_used_bytes);
    const tot  = _fmtGB0(sys.disk_total_bytes);
    diskText = (used != null && tot != null) ? (drv + used + ' GB / ' + tot + ' GB') : (drv + pct + '%');
    diskWarn = pct >= 88 && pct < 95;
    diskCrit = pct >= 95;
  }
  _updateSysresRow('sysresDiskRow','sysresDisk',{ text: diskText, warn: diskWarn, crit: diskCrit });
}

async function loadSysResources(){
  try{
    const t = await fetch('/api/status').then(r=>r.json());
    _applySysres(t && t.system);
  }catch(e){
    const bar = $('sysresBar');
    if(bar) bar.hidden = true;
    if(document.body) document.body.classList.remove('has-sysres');
  }
}

/* ============================================================
 * Live status (gauge)
 * ============================================================ */
async function loadStatus(){
  try{
    const t=await fetch('/api/status').then(r=>r.json());
    const syncVal = t.sync ?? '—';
    const ledgerVal = t.ledger!=null ? Number(t.ledger).toLocaleString('en-US') : '—';
    const ageVal = t.ledger_age!=null ? t.ledger_age+'s' : '—';
    const peersVal = t.peers!=null ? String(t.peers) : ((t.peer_in!=null||t.peer_out!=null)?String((t.peer_in??0)+(t.peer_out??0)):'—');

    const rawH = (t.core_health!=null && t.docker_sock) ? t.core_health : t.health;
    const health = rawH!=null ? Math.min(100, Math.max(0, Number(rawH))) : 0;

    let color = '#16c60c';
    let statusText = 'Excellent';
    if(health < 50){ color='#e81123'; statusText='Poor'; }
    else if(health < 75){ color='#ffc107'; statusText='Fair'; }
    else if(health < 90){ color='#a3e635'; statusText='Good'; }

    const maxArc = 257.61;
    const offset = maxArc * (1 - (health / 100));

    const sEl = $('s');
    if(!sEl) return;
    sEl.innerHTML = `
      <div class="status-layout">
        <div class="status-col left">
          <span class="k">Sync</span>
          <span class="k">Ledger</span>
          <span class="k">Age</span>
          <span class="k">Peers</span>
        </div>
        <div class="gauge-wrap">
          <svg viewBox="0 0 200 120" class="gauge-svg">
            <path d="M 18 95 A 82 82 0 0 1 182 95" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="14" stroke-linecap="round"/>
            <path d="M 18 95 A 82 82 0 0 1 182 95" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round" stroke-dasharray="257.61" stroke-dashoffset="${offset}" style="transition: stroke-dashoffset 0.6s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.5s ease;"/>
            <text x="18" y="114" fill="#d7deea" font-size="11" font-weight="600" text-anchor="middle">0</text>
            <text x="182" y="114" fill="#d7deea" font-size="11" font-weight="600" text-anchor="middle">100</text>
          </svg>
          <div class="gauge-center">
            <div class="gauge-score" style="color:${color}">${health} / 100</div>
            <div class="gauge-label">Node Health</div>
            <div class="gauge-status">Status: <span style="color:${color}">${statusText}</span></div>
          </div>
        </div>
        <div class="status-col right">
          <span class="val">${syncVal}</span>
          <span class="val">${ledgerVal}</span>
          <span class="val">${ageVal}</span>
          <span class="val">${peersVal}</span>
        </div>
      </div>
    `;

    // Also refresh the SYSTEM RESOURCES bar in the same fetch (no extra HTTP)
    _applySysres(t && t.system);

    const note=$('pn-horizon-note');
    if(note){
      const sock=t.docker_sock===true||t.docker_probe===true||t.hasDockerSock===true;
      note.hidden=!!sock;
    }
  }catch(e){ const sEl=$('s'); if(sEl) sEl.textContent='Status error'; }
}

async function send(){
  const inp=$('inp');let msg=(inp.value||'').trim();if(!msg)return;
  if(msg.length>2000)msg=msg.slice(0,2000);
  inp.value='';
  add('user',msg);add('bot','…');
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});
    const j=await r.json();
    if(box) box.lastChild.textContent=j.reply||j.error||'No reply';
    if(j.images&&j.images.length){
      const wrap=document.createElement('div');
      wrap.className='msg bot';
      wrap.style.textAlign='center';
      j.images.forEach(function(src){
        const im=document.createElement('img');
        im.src=src; im.alt='QR'; im.style.maxWidth='46%'; im.style.margin='4px'; im.style.borderRadius='8px';
        wrap.appendChild(im);
      });
      if(box){ box.appendChild(wrap); box.scrollTop=box.scrollHeight; }
    }
  }catch(e){ if(box) box.lastChild.textContent='Chat error'; }
}

on($('dkTip'),'click',function(){
  const read=$('dkRead'), agree=$('dkAgree'), conf=$('dkConfirm'), modal=$('dkModal');
  if(!read||!agree||!conf||!modal) return;
  read.checked=false;
  agree.checked=false;
  read.disabled=true;
  agree.disabled=false;
  conf.disabled=true;
  modal.classList.add('on');
  if(termsBox) termsBox.scrollTop=0;
  setupTermsScroll();
});
on($('dkCancel'),'click',function(){
  const modal=$('dkModal'); if(modal) modal.classList.remove('on');
});
on($('dkConfirm'),'click',async function(){
  const conf=$('dkConfirm'), modal=$('dkModal');
  if(!conf||conf.disabled)return;
  if(modal) modal.classList.remove('on');
  add('bot','…');
  try{
    const r=await fetch('/api/docker',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:true,consent:true,terms_version:'docker-optional-v1',read_full:true})});
    const j=await r.json();
    if(!j.ok){ if(box) box.lastChild.textContent=j.error||'Failed';return; }
    if(box) box.lastChild.textContent=j.wrote_host
      ? 'Terms accepted. docker-compose.yml updated.\nSoloHost: press Stop, then Start the app again.'
      : (j.hint||'Saved. SoloHost: Stop → Start if compose updated.');
  }catch(e){ if(box) box.lastChild.textContent='Network error'; }
});
on($('dkAgree'),'change',function(){
  const read=$('dkRead'), agree=$('dkAgree'), conf=$('dkConfirm');
  if(!read||!agree||!conf) return;
  conf.disabled=!(read.checked&&agree.checked);
});

const ACT={
 '/actions/CleanRAM.bat':'🧹 CleanRAM\nWhat: Frees RAM. Closes extra apps and temp files.\nWhen: PC is slow and the node is still synced.',
 '/actions/CleanRam.bat':'🧹 CleanRAM\nWhat: Frees RAM. Closes extra apps and temp files.\nWhen: PC is slow and the node is still synced.',
 '/actions/DnsFlush.bat':'🌐 DnsFlush\nWhat: Refresh Windows DNS cache.\nWhen: Peers drop while ports stay open.',
 '/actions/Firewall.bat':'🧱 Firewall\nWhat: Open TCP 31401-31410 on Windows Firewall.\nWhen: Local Pi ports stay closed.',
 '/actions/NetRepair.bat':'🔧 NetRepair\nWhat: Repair internet while keeping the current LAN IP.\nWhen: Horizon or internet is down for a long time.',
 '/actions/LanSetup.bat':'📌 LanSetup\nWhat: Lock the current LAN IP as static + open Pi ports.\nWhen: First setup on this PC.',
 '/actions/NodeReset.bat':'♻️ NodeReset\nWhat: Restart the Pi container only.\nWhen: The container is stuck and Docker Engine is healthy.',
 '/actions/DockerRecover.bat':'🐳 DockerRecover\nWhat: Restart Docker Desktop safely.\nWhen: Docker Engine itself is down.',
 '/actions/Maintain.bat':'🗓️ Maintain\nWhat: Weekly cleanup and optional Sunday task.\nWhen: Node is healthy.'
};
on($('abar'),'click',function(e){
  const b=e.target.closest('button[data-dl]'); if(!b)return;
  const href=b.getAttribute('data-dl');
  add('bot', (ACT[href]||'Download repair BAT')+'\n\nSaving: '+href);
  const a=document.createElement('a'); a.href=href; a.download=''; document.body.appendChild(a); a.click(); a.remove();
});
on($('qbar'),'click',function(e){
  const b=e.target.closest('button[data-cmd]');
  if(!b)return;
  const inp=$('inp');
  if(inp) inp.value=b.getAttribute('data-cmd');
  send();
});
on($('send'),'click',send);
on($('inp'),'keydown',e=>{if(e.key==='Enter')send();});

const BG={cave:'url("/bg-cave.jpg")',classic:'url("/bg-classic.jpg")',pi:'url("/bg-pi.jpg")'};
function applyBg(kind, custom){
  const root=document.documentElement;
  if(kind==='custom' && custom){ root.style.setProperty('--bg-image','url("'+custom+'")'); }
  else { root.style.setProperty('--bg-image', BG[kind]||BG.cave); kind = BG[kind]?kind:'cave'; }
  document.querySelectorAll('.bgbar button').forEach(b=>b.classList.toggle('on', b.getAttribute('data-bg')===kind));
  try{ localStorage.setItem('pinode_bg', JSON.stringify({kind, custom: kind==='custom'?custom:''})); }catch(e){}
}
try{
  const saved=JSON.parse(localStorage.getItem('pinode_bg')||'{}');
  applyBg(saved.kind||'cave', saved.custom||'');
}catch(e){ applyBg('cave'); }
on($('bgCave'),'click',()=>applyBg('cave'));
on($('bgClassic'),'click',()=>applyBg('classic'));
on($('bgPi'),'click',()=>applyBg('pi'));
on($('bgFile'),'change',function(){
  const f=this.files&&this.files[0]; if(!f)return;
  if(f.size>2500000){ add('bot','🌄 Wallpaper too large (max 2.5 MB).'); return; }
  const r=new FileReader();
  r.onload=()=>applyBg('custom', r.result);
  r.readAsDataURL(f);
});

async function loadAlerts(){
  try{
    const j=await fetch('/api/alerts').then(r=>r.json());
    const n=j.unread||0;
    const badge=$('badge');
    if(badge){ badge.textContent=n; badge.style.display=n?'inline-block':'none'; }
    const pan=$('alertPanel');
    if(!pan) return;
    if(!j.items||!j.items.length){pan.innerHTML='🔔 No action alerts.';return;}
    pan.innerHTML=j.items.map(function(it){
      return '<div class="item">'+(it.ts||'').replace('T',' ').slice(0,16)+'\n'+(it.text||'')+(it.tip?'\n💡 '+it.tip:'')+(it.scripts?'\n🛠️ '+it.scripts:'')+'</div>';
    }).join('');
  }catch(e){}
}
on($('bell'),'click',async function(){
  const pan=$('alertPanel');
  if(!pan) return;
  pan.classList.toggle('on');
  if(pan.classList.contains('on')){
    try{ await fetch('/api/alerts',{method:'POST'}); }catch(e){}
    const badge=$('badge'); if(badge) badge.style.display='none';
    loadAlerts();
  }
});
loadAlerts();setInterval(loadAlerts,20000);

// Initial load + periodic refresh
loadSysResources();
loadStatus();
setInterval(loadStatus,15000);
</script>
