# SoloHost Official — sandbox; no docker.sock until Operator consents and Stop→Start

services:
  agent:
    image: ghcr.io/cannoi/pinode-telegram-solohost:v2.6.57
    pull_policy: missing

    labels:
      pi.ui.primary: "true"

    ports:
      - "127.0.0.1:18780:8080"

    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - CHAT_ID=${CHAT_ID}
      - GEMINI_API_KEY=${GEMINI_API_KEY}

      - NODE_HOST=host.docker.internal
      - HORIZON_PORT=31401
      - CORE_HTTP_PORT=11626

      # Docker is optional and OFF by default.
      - DOCKER_PROBE=0
      - AUTO_DOCKER_SOCK=0

      # Monitoring interval
      - TELEMETRY_SEC=60

      # Timezone
      - TZ=Asia/Ho_Chi_Minh

    volumes:
      - ./data:/data
      - ./:/solohost-config:rw
      # [2.6.57-fix] Overlay local public/ (with SYSTEM RESOURCES bar) over image.
      - ./public:/app/public:rw
      # [2.6.57-fix] Optional: overlay host-metrics.js directly (uncomment if needed).
      # - ./host-metrics.js:/app/host-metrics.js:ro

    restart: unless-stopped
