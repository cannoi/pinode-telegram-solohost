services:
  agent:
    image: ghcr.io/cannoi/pinode-telegram-solohost:v2.2.0
    container_name: PiNode-Telegram-Controller
    labels:
      pi.ui.primary: "true"
    ports:
      - '127.0.0.1:18780:8080'
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - CHAT_ID=${CHAT_ID}
      - ALERT_ON_START=${ALERT_ON_START}
      - REPORT_HOURS=${REPORT_HOURS}
      - ALERT_COOLDOWN_SEC=${ALERT_COOLDOWN_SEC}
      - NODE_HOST=host.docker.internal
      - TZ=Asia/Ho_Chi_Minh
      # Tùy chọn: chỉ định tên container cố định (để trống = tự tìm)
      - PI_CONTAINER=${PI_CONTAINER:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro   # ← thêm dòng này
    restart: unless-stopped
