# SoloHost — NO docker.sock
services:
  agent:
    image: ghcr.io/cannoi/pinode-telegram-solohost:v2.5.0
    container_name: PiNode-Telegram-Controller
    labels:
      pi.ui.primary: "true"
    ports:
      - '127.0.0.1:18780:8080'
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - CHAT_ID=${CHAT_ID}
      - DATA_LIVE_URL=http://host.docker.internal:18790
      - DATA_LIVE_TOKEN=${DATA_LIVE_TOKEN}
      - NODE_HOST=host.docker.internal
      - HORIZON_PORT=31401
      - PI_CONTAINER=${PI_CONTAINER}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TELEMETRY_SEC=60
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./data:/data
    restart: unless-stopped
