# docker-compose.yml — Pi Desktop / SoloHost
# v2.3.0: tự dò testnet2/mainnet + stellar-core info + Docker socket read-only
services:
  agent:
    image: ghcr.io/cannoi/pinode-telegram-solohost:v2.3.0
    container_name: PiNode-Telegram-Controller
    labels:
      pi.ui.primary: "true"
    ports:
      - '127.0.0.1:18780:8080'
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - CHAT_ID=${CHAT_ID}
      - ALERT_ON_START=${ALERT_ON_START:-true}
      - REPORT_HOURS=${REPORT_HOURS:-7,19}
      - ALERT_COOLDOWN_SEC=${ALERT_COOLDOWN_SEC:-60}
      - NODE_HOST=host.docker.internal
      - TZ=Asia/Ho_Chi_Minh
      # Để trống = tự dò testnet2 / mainnet / pi-node-docker
      - PI_CONTAINER=${PI_CONTAINER:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
