# SoloHost v2.6.2 — no docker.sock, no DataLive, no fixed container name
services:
  agent:
    image: ghcr.io/cannoi/pinode-telegram-solohost:v2.6.2
    labels:
      pi.ui.primary: "true"
    ports:
      - '127.0.0.1:18780:8080'
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - CHAT_ID=${CHAT_ID}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NODE_HOST=host.docker.internal
      - HORIZON_PORT=31401
      - TELEMETRY_SEC=60
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./data:/data
    restart: unless-stopped
