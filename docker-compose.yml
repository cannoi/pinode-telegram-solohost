# SoloHost v2.4.2 — KHÔNG mount docker.sock
services:
  agent:
    image: ghcr.io/cannoi/pinode-telegram-solohost:v2.4.2
    container_name: PiNode-Telegram-Controller
    labels:
      pi.ui.primary: "true"
    ports:
      - '127.0.0.1:18780:8080'
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - CHAT_ID=${CHAT_ID}
      - ALERT_ON_START=${ALERT_ON_START}
      - REPORT_HOURS=${REPORT_HOURS}
      - ALERT_COOLDOWN_SEC=${ALERT_COOLDOWN_SEC}
      - NODE_HOST=host.docker.internal
      - HORIZON_PORT=${HORIZON_PORT}
      - STELLAR_CORE_PORT=${STELLAR_CORE_PORT}
      - PI_CONTAINER=${PI_CONTAINER}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./data:/data
    restart: unless-stopped
