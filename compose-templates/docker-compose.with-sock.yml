services:
  agent:
    image: ghcr.io/cannoi/pinode-telegram-solohost:v2.6.19
    labels:
      pi.ui.primary: "true"
    ports:
      - "127.0.0.1:18780:8080"
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - CHAT_ID=${CHAT_ID}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NODE_HOST=host.docker.internal
      - HORIZON_PORT=31401
      - CORE_HTTP_PORT=11626
      - DOCKER_PROBE=1
      - AUTO_DOCKER_SOCK=1
      - TELEMETRY_SEC=60
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./data:/data
      - ./:/solohost-config:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
