name: Build and publish SoloHost image
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show build context
        run: |
          ls -la
          test -f Dockerfile
          test -f loader.js
          test -f app.js
          test -f package.json
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pinode-telegram-solohost:latest
            ghcr.io/${{ github.repository_owner }}/pinode-telegram-solohost:v2.6.39
