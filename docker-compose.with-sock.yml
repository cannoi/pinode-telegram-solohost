# Bản có docker.sock — dùng ngoài SoloHost hoặc khi host cho phép.
# SoloHost sẽ TỪ CHỐI file này (bind-mount ngoài thư mục cài).
services:
  agent:
    image: ghcr.io/cannoi/pinode-telegram-solohost:v2.4.1
    container_name: PiNode-Telegram-Controller
    labels:
      pi.ui.primary: "true"
    ports:
      - '127.0.0.1:18780:8080'
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - CHAT_ID=${CHAT_ID}
      - ALERT_ON_START=${ALERT_ON_START}
      - REPORT_HOURS=${REPORT_HOURS}
      - ALERT_COOLDOWN_SEC=${ALERT_COOLDOWN_SEC}
      - NODE_HOST=host.docker.internal
      - STELLAR_CORE_PORT=${STELLAR_CORE_PORT}
      - PI_CONTAINER=${PI_CONTAINER}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TZ=Asia/Ho_Chi_Minh
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
